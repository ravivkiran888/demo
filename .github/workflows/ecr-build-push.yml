
name: Build and Deploy to Amazon ECS

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 3: Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            371726673946.dkr.ecr.ap-south-1.amazonaws.com/docker-demo:${{ github.sha }}
            371726673946.dkr.ecr.ap-south-1.amazonaws.com/docker-demo:latest

      # Step 5: Download existing ECS task definition
      - name: Download ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition docker-demo-task \
            --query taskDefinition \
            > task-definition.json

      # Step 6: Update container image in task definition
      - name: Render ECS task definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: docker-demo
          image: 371726673946.dkr.ecr.ap-south-1.amazonaws.com/docker-demo:${{ github.sha }}

      # Step 7: Deploy new task definition to ECS
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: docker-demo-service
          cluster: production-cluster
          wait-for-service-stability: true
